name: CI

on:
  push:
    branches: [main]
    # 打 apk-* tag = 钉一个可回退的 APK（例：apk-m0）。见下方「回退点」步骤。
    tags: ['apk-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  invariants:
    name: 铁律检查（零依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: core 不得依赖 Android
        run: bash tools/check-core-purity.sh

      # Kotlin 块注释可嵌套：注释里写 `cards/*.png` 会吞掉后面整个文件，
      # 报错却在 EOF，极难定位。真实踩过一次。
      - name: Kotlin 块注释不得嵌套/未闭合
        run: bash tools/check-kotlin-comments.sh

      # 重复 import 只有在编译期才报错，而这台机器编不了 Android 模块。
      # 放到铁律检查里，10 秒挡住，不用等 6 分钟的构建。
      - name: Kotlin 没有重复 import
        run: bash tools/check-kotlin-imports.sh

      # 词表是"用户和 AI 说同一个东西"的唯一依据：漂了就会出现"说了名字、代码里没有"。
      - name: UI 词表与代码一致
        run: bash tools/check-ui-map.sh

      # 真机上坏过的不变量（超高气泡命中、选字拖列表、弹层、inset）。判据见 docs/ui-invariants.md。
      - name: UI 不变量成立
        run: bash tools/check-ui-invariants.sh

      # 判据同时可在本机跑（`bash tools/check-doc-links.sh`）：链接写错不该拿一轮 CI 去换。
      - name: 文档相对链接必须可解析
        run: bash tools/check-doc-links.sh

  jvm-tests:
    name: 纯 JVM 单测（兼容性断言）
    runs-on: ubuntu-latest
    permissions:
      contents: write # 只用于失败时把日志发成 release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties 的 `-Xmx896m -XX:MaxMetaspaceSize=320m` 是给本机（1.7 GiB）调的，
      # runner 有 7 GB 却照这套跑：加一个依赖就会 OutOfMemoryError: Metaspace（2026-11-22 真踩）。
      - name: 放宽编译内存（runner 比本机富）
        run: |
          sed -i 's/-Xmx896m -XX:MaxMetaspaceSize=320m/-Xmx3g -XX:MaxMetaspaceSize=1g/' gradle.properties
          grep '^org.gradle.jvmargs' gradle.properties

      - name: 单测
        run: |
          set -o pipefail
          ./gradlew test --stacktrace 2>&1 | tee build.log

      - name: 确认没有测试被静默跳过
        run: bash tools/check-tests-ran.sh

      # 这台机器没有 PAT，Actions 日志登录才看得到；失败时把日志挂成 release，
      # 公开可读，排查不依赖任何人的账号。
      # 失败时把日志暴露成**不需要登录**能看到的东西（这台机器没有 PAT）：
      # ① 关键行打成 annotation（run 页面直接显示）；② 按 sha 命名的日志挂到 release。
      # 2026-11-26 踩过：用 action-gh-release 上传固定名 build.log，同名资产撞名导致这一步自己红了。
      - name: 失败时公开日志
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          grep -E '^e: |FAILED|FAILURE:|There were failing tests|AssertionFailedError|expected:' build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          cp build.log "build-${GITHUB_SHA::7}.log" || true
          gh release upload ci-log-jvm "build-${GITHUB_SHA::7}.log" --clobber || true

  android-build:
    name: 出 debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # 失败日志 + 公开 APK 都落到 release
    # M0 建出 app 模块之前这里只做一次探测并跳过——避免"还没有 Android 工程却报红"。
    # 注意：hashFiles() 在 job 级 if 里不可用（GitHub 会判 "Invalid workflow file"），只能放进 step。
    steps:
      - uses: actions/checkout@v4

      - name: 探测 app 模块
        id: probe
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app 模块还没建（M0 之前），跳过出包"
          fi
          echo "stamp=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.probe.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.probe.outputs.ready == 'true'

      # gradle.properties 的 `-Xmx896m -XX:MaxMetaspaceSize=320m` 是给本机（1.7 GiB）调的，
      # runner 有 7 GB 却照这套跑：加一个依赖就会 OutOfMemoryError: Metaspace（2026-11-22 真踩）。
      - name: 放宽编译内存（runner 比本机富）
        run: |
          sed -i 's/-Xmx896m -XX:MaxMetaspaceSize=320m/-Xmx3g -XX:MaxMetaspaceSize=1g/' gradle.properties
          grep '^org.gradle.jvmargs' gradle.properties

      # versionCode 必须单调递增，否则手机会把新包当降级直接拒装。
      # run_number 在整个仓库生命周期内只增不减，正好当 versionCode 用。
      - name: 出包
        if: steps.probe.outputs.ready == 'true'
        env:
          TAVERN_VERSION_CODE: ${{ github.run_number }}
          TAVERN_BUILD_ID: ${{ github.sha }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      # 冒烟：把"签的是不是那把固定钥匙""versionCode 有没有递增"打进日志。
      # 工具路径在各版本 runner 上会变，找不到就降级成 warning，不要让诊断步骤挡住出包。
      - name: 核对签名与 versionCode（冒烟）
        if: steps.probe.outputs.ready == 'true' && success()
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT2=$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)

          if [ -z "$AAPT2" ]; then
            echo "::warning::找不到 aapt2（SDK=$SDK），跳过 badging 核对"
          else
            echo "== badging =="
            "$AAPT2" dump badging "$APK" | grep -E "^package:|sdkVersion:|targetSdkVersion:|uses-permission: name='android.permission.INTERNET'" || true
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "::warning::找不到 apksigner，跳过签名核对"
          else
            echo "== 签名 =="
            "$APKSIGNER" verify --print-certs "$APK" | grep -E "Signer #1 certificate (SHA-256 digest|DN)" || true
          fi

      - name: 上传 APK（需登录才能下）
        if: steps.probe.outputs.ready == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # artifact 下载要登录；release 资产公开可下，手机浏览器点一下就能装。
      - name: 公开 APK（apk-latest release）
        if: steps.probe.outputs.ready == 'true' && success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 最新 debug APK
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
          body: |
            每次 main 构建成功后覆盖。手机浏览器打开本页即可下载安装。

            - commit：`${{ github.sha }}`
            - 构建：${{ steps.probe.outputs.stamp }}
            - 运行：[${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # 回退点：打 apk-* tag 就把它构建出来钉成一个独立 release（资产不会被后续构建覆盖）。
      # 例：git tag apk-m0 && git push origin apk-m0
      - name: 公开 APK（回退点 tag）
        if: steps.probe.outputs.ready == 'true' && success() && startsWith(github.ref, 'refs/tags/apk-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 回退点 ${{ github.ref_name }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
          body: |
            钉死的 APK（后续构建不会覆盖这里）。出问题时回装这一版。

            - commit：`${{ github.sha }}`
            - 构建：${{ steps.probe.outputs.stamp }}
            - 签名：固定，可直接覆盖安装

      - name: 失败时公开日志
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          grep -E '^e: |FAILED|FAILURE:|error:' build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          cp build.log "build-${GITHUB_SHA::7}.log" || true
          gh release upload ci-log-android "build-${GITHUB_SHA::7}.log" --clobber || true
