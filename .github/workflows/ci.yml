name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  invariants:
    name: 铁律检查（零依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: core 不得依赖 Android
        run: bash tools/check-core-purity.sh

      - name: 文档相对链接必须可解析
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          bad = []
          for f in glob.glob('**/*.md', recursive=True):
              if f.startswith('vendor/'):
                  continue
              base = os.path.dirname(f)
              for m in re.finditer(r'\]\(([^)]+)\)', open(f, encoding='utf-8').read()):
                  t = m.group(1).split('#')[0]
                  if not t or t.startswith(('http', 'mailto:')):
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(base, t))):
                      bad.append(f'{f} -> {t}')
          print('\n'.join(bad) if bad else 'OK')
          sys.exit(1 if bad else 0)
          PY

  jvm-tests:
    name: 纯 JVM 单测（兼容性断言）
    runs-on: ubuntu-latest
    permissions:
      contents: write # 只用于失败时把日志发成 release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 单测
        run: |
          set -o pipefail
          ./gradlew test --stacktrace 2>&1 | tee build.log

      - name: 确认没有测试被静默跳过
        run: bash tools/check-tests-ran.sh

      # 这台机器没有 PAT，Actions 日志登录才看得到；失败时把日志挂成 release，
      # 公开可读，排查不依赖任何人的账号。
      - name: 失败时公开日志
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log-jvm
          name: CI 失败日志（jvm-tests）
          prerelease: true
          files: build.log
          body: 自动发布，最近一次 jvm-tests 失败的构建日志。

  android-build:
    name: 出 debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # 失败日志 + 公开 APK 都落到 release
    # M0 建出 app 模块之前这里只做一次探测并跳过——避免"还没有 Android 工程却报红"。
    # 注意：hashFiles() 在 job 级 if 里不可用（GitHub 会判 "Invalid workflow file"），只能放进 step。
    steps:
      - uses: actions/checkout@v4

      - name: 探测 app 模块
        id: probe
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app 模块还没建（M0 之前），跳过出包"
          fi

      - uses: actions/setup-java@v4
        if: steps.probe.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.probe.outputs.ready == 'true'

      - name: 出包
        if: steps.probe.outputs.ready == 'true'
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: 上传 APK（需登录才能下）
        if: steps.probe.outputs.ready == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      # artifact 下载要登录；release 资产公开可下，手机浏览器点一下就能装。
      - name: 公开 APK（apk-latest release）
        if: steps.probe.outputs.ready == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 最新 debug APK
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
          body: 每次 main 构建成功后覆盖。手机浏览器打开本页即可下载安装。

      - name: 失败时公开日志
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log-android
          name: CI 失败日志（android-build）
          prerelease: true
          files: build.log
          body: 自动发布，最近一次 android-build 失败的构建日志。
